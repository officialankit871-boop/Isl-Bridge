seed: 42

max_frames: 128
batch_size: 16
epochs: 60

learning_rate: 0.0001
weight_decay: 0.001

cnn_channels_1: 64
cnn_channels_2: 128

lstm_hidden_size: 64
lstm_layers: 2

cnn_dropout: 0.25
lstm_dropout: 0.30
classifier_dropout: 0.50

patience: 12
gradient_clip: 1.0

use_class_weights: false
max_class_weight: 3.0
label_smoothing: 0.05

num_workers: 0

augmentation:
  enabled: true

  temporal_crop:
    enabled: true
    probability: 0.5

  temporal_scale:
    enabled: true
    probability: 0.3
    min_scale: 0.90
    max_scale: 1.10

  landmark_noise:
    enabled: true
    probability: 0.3
    std: 0.005

  frame_dropout:
    enabled: true
    probability: 0.3
    frame_probability: 0.05
